# Local dependencies for PoMarriedFight.
#
# azurite — runs with `--oauth basic` over HTTPS on purpose: the solution authenticates to Storage exclusively with
# DefaultAzureCredential and has no connection-string code path (BannedSymbols.txt makes that a build error). The Azure
# SDK refuses to send a bearer token over plain HTTP, so the cert is mandatory; SCRIPTS/azurite.ps1 exports the ASP.NET
# Core dev cert (already trusted on the machine) into ./certs.
#
# Ports are 12000–12002 because PoArgueJudge (10000–10002) and PoMarriedLife (11000–11002) already bind the others.
#
# seq — structured log viewer at http://localhost:5341 (Serilog.Sinks.Seq, Development only).
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: pomarriedfight-azurite
    restart: unless-stopped
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --oauth basic
      --cert /certs/azurite.pfx
      --pwd ${AZURITE_CERT_PASSWORD:-azurite}
      --skipApiVersionCheck
      --location /data
    ports:
      - "12000:10000"   # blob
      - "12001:10001"   # queue (unused; exposed for parity)
      - "12002:10002"   # table
    volumes:
      - ./certs:/certs:ro
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  seq:
    image: datalust/seq:latest
    container_name: pomarriedfight-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  azurite-data:
  seq-data:
